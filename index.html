<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>診断④ やり直し2日間</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a33; --sub:#6b7680; --line:#ddd6c8;
  --accent:#1f6f78; --ok:#2e8b57; --ng:#c0392b; --warn:#b7791f;
  --kokugo:#b5473a; --sugaku:#2f6db5; --eigo:#7a4fb0; --shakai:#3d8b4f; --rika:#c47a1c; --mix:#1f6f78; --rest:#8a939b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:none}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
h1{font-size:21px;letter-spacing:.03em}
.btn{padding:11px 16px;border-radius:10px;font-size:16px;font-weight:700;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ng{background:var(--ng);color:#fff;border-color:var(--ng)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.hidden{display:none!important}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:12px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:17px;font-weight:700}
.tab.on{border-color:var(--accent);color:var(--accent)}
.tab small{display:block;font-size:13px;color:var(--sub);font-weight:400}
.daybar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:4px 0 14px}
.daybar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.blk{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:7px solid var(--c);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.blk .tm{font-size:13px;color:var(--sub);min-width:84px;line-height:1.4}
.blk .tm b{display:block;font-size:15px;color:var(--ink)}
.blk .tt{flex:1;font-size:16px;font-weight:700;line-height:1.45}
.blk .tt small{display:block;font-size:13px;color:var(--sub);font-weight:400}
.blk .st{font-size:14px;font-weight:700;min-width:64px;text-align:right}
.blk.done{opacity:.72}
.blk.done .st{color:var(--ok)}
.qpace{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:-4px 0 10px}
.qpace i{display:block;height:100%;width:0;background:var(--ok);transition:width 1s linear,background .3s}
.qpace i.warn{background:var(--warn)} .qpace i.over{background:var(--ng)}
.pace{font-size:13px;font-weight:700;min-width:96px;text-align:right}
.pace.ahead{color:var(--ok)} .pace.behind{color:var(--ng)}
.slothead{font-size:15px;font-weight:800;color:var(--accent);margin:14px 2px 6px}
.gap{font-size:13px;color:var(--sub);text-align:center;margin:8px 0;padding:6px;border:1px dashed var(--line);border-radius:10px}
canvas#pad.big{height:560px}
.note{margin-top:14px;font-size:13px;color:var(--sub);line-height:1.7}
/* run */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tag{padding:4px 12px;border-radius:999px;color:#fff;font-weight:700;font-size:14px;background:var(--c);white-space:nowrap}
.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);transition:width .3s}
.qcount{font-weight:700;font-size:15px;min-width:52px;text-align:right}
.clock{font-weight:700;font-size:15px;color:var(--sub);min-width:92px;text-align:right}
.clock.over{color:var(--ng)}
.card{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ref{display:inline-block;font-size:13px;font-weight:700;color:var(--c);border:2px solid var(--c);border-radius:8px;padding:1px 8px;margin-bottom:8px}
.qtext{font-size:21px;line-height:1.65;font-weight:600;user-select:text;-webkit-user-select:text}
.lead{font-size:16px;line-height:1.7}
.points li{margin:8px 0 8px 1.2em;font-size:17px;line-height:1.65}
.hintbox{margin-top:10px;padding:10px 12px;background:#fff7e6;border-radius:10px;font-size:16px;line-height:1.6}
.padwrap{position:relative;background:#fff;border-radius:14px;border:2px solid var(--line);overflow:hidden}
canvas#pad{display:block;width:100%;height:300px;touch-action:none;background:repeating-linear-gradient(#fff 0 74px,#e9eef2 74px 76px)}
.padhint{position:absolute;left:14px;top:10px;font-size:13px;color:#a9b2ba;pointer-events:none}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools .sp{flex:1}
.res{background:var(--card);border-radius:14px;padding:14px 18px;margin-top:10px;border-left:8px solid var(--line)}
.res.ok{border-left-color:var(--ok)} .res.ng{border-left-color:var(--ng)}
.res .mark{font-size:28px;font-weight:900;margin-right:8px}
.res.ok .mark{color:var(--ok)} .res.ng .mark{color:var(--ng)}
.res .row{font-size:17px;margin-top:6px;line-height:1.65}
.res .row b{color:var(--sub);font-weight:600;font-size:14px;margin-right:6px}
.res .fix{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.pts label{display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.6;padding:10px 4px;border-bottom:1px dashed var(--line)}
.pts input{width:26px;height:26px;margin-top:3px;flex:none}
.big{font-size:56px;font-weight:900;color:var(--c);text-align:center;margin:8px 0}
.say{display:flex;gap:10px;align-items:center;margin-top:8px}
.listenbtn{font-size:22px;padding:14px 22px}
table.sum{width:100%;border-collapse:collapse;font-size:15px}
table.sum td,table.sum th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:640px;width:100%}
.modal label{display:block;margin:10px 0;font-size:15px}
.modal input[type=text]{width:100%;padding:10px;font-size:16px;border:2px solid var(--line);border-radius:8px;margin-top:4px}
@media (max-width:640px){.qtext{font-size:18px}canvas#pad{height:240px}.blk .tm{min-width:70px}}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="home" class="wrap">
  <header>
    <h1>学習の診断④ やり直し 2日間</h1>
    <div style="display:flex;gap:8px">
      <button class="btn sm" onclick="openSummary()">📖 記録</button>
      <button class="btn sm" onclick="openSettings()">⚙ 設定</button>
    </div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="daybar"><i id="dayBar"></i></div>
  <div id="blockList"></div>
  <div class="note" id="modeNote"></div>
</div>

<!-- ===== RUN ===== -->
<div id="run" class="wrap hidden">
  <div class="qtop">
    <button class="btn sm" onclick="quitBlock()">✕</button>
    <span class="tag" id="rTag"></span>
    <div class="prog"><i id="rProg"></i></div>
    <span class="qcount" id="rCount"></span>
    <span class="pace" id="rPace"></span>
    <span class="clock" id="rClock"></span>
  </div>
  <div class="qpace" id="qPace"><i id="qPaceBar"></i></div>
  <div id="stage"></div>
  <div id="padArea" class="hidden">
  <div class="padwrap"><canvas id="pad"></canvas><div class="padhint" id="padHint">ここに答えを書こう</div></div>
  <div class="tools">
    <button class="btn" onclick="undo()">↶ 1画もどす</button>
    <button class="btn" onclick="clearPad()">🗑 全部消す</button>
    <div class="sp"></div>
    <button class="btn primary" id="gradeBtn" onclick="onGrade()">答え合わせ</button>
  </div>
  </div>
  <div id="resBox"></div>
</div>

<div id="modal" class="modal hidden"><div class="card" id="modalBody"></div></div>

<script>
/* =========================================================
   学習の診断④ やり直し 2日間セット（11/16 月 4時間・11/17 火 2時間）
   ・問題用紙の文章はここに入れない（禁複製のため）。①やり直しは「問題用紙の番号」を指示するだけ
   ・②〜④の問題はすべてオリジナル
   ・m:"exact" … 正解を見せずに書き起こし→照合（用語・漢字・英単語・記号）
     m:"ai"    … 正解と基準を渡して意味で判定（式・文・記述）
   ・解答用紙が届いたら、①の items を差し替える（pending:true は未確認）
   ========================================================= */

/* 全問やり直し（①）— 問題用紙の番号を指示。答えは正答表より。記述は基準を言いかえて判定 */
function Q(id, ref, a, m, o){ return Object.assign({ id, ref, q:`問題用紙の<b>${ref}</b>`, a:Array.isArray(a)?a:[a], m:m==="c"?"exact":m, sort:m==="c" }, m==="c"?{hint:"カタカナの記号（順不同）"}:{}, o||{}); }

const REDO = {
sugaku: [
  Q("rs01","数学 問題1(1)","10","exact",{hint:"数字"}),
  Q("rs02","数学 問題1(2)","-1/4","ai",{rule:"−1/4 なら正解。",exp:"わり算が先：3/4÷(−3/2)=−1/2 → 1/4−1/2=−1/4。テストは左から計算して 3/4。"}),
  Q("rs03","数学 問題1(3)","-x²-1","ai",{rule:"−x²−1 なら正解。"}),
  Q("rs04","数学 問題1(4)","(a+b+3)(a+b+5)","ai",{rule:"(a+b+3)(a+b+5) と同じなら正解（順不同）。展開した式は不正解。",hint:"a+b を A と置く。",exp:"A²+8A+15=(A+3)(A+5)。(a+b)² を a²+b² にしないこと。"}),
  Q("rs05","数学 問題1(5)","√3−1","ai",{rule:"√3−1 なら正解。",exp:"√6÷√2=√3、√2÷√2=1。かけ算にしない。"}),
  Q("rs06","数学 問題1(6)","x=-2,1","ai",{rule:"x=−2 と x=1 の両方で正解。",hint:"まず両辺を2で割る。",exp:"x²+x−2=0 → (x+2)(x−1)=0。解の公式なら −4ac=+32。"}),
  Q("rs07","数学 問題2(1)","ア","exact",{hint:"カタカナの記号"}),
  Q("rs08","数学 問題2(2)","ウ","exact",{hint:"カタカナの記号"}),
  Q("rs09","数学 問題2(3)","4/9倍","ai",{rule:"4/9 なら正解。",exp:"9a=4b → a=4/9 b。"}),
  Q("rs10","数学 問題2(4)","-0.05x+0.06y","ai",{rule:"−0.05x+0.06y と同じ式なら正解。",exp:"増えた人数どうし。5%=0.05、減ったらマイナス。"}),
  Q("rs11","数学 問題2(5)","27","exact",{hint:"数字",exp:"25<n<36 で 3n が平方数 → 3n=81 → n=27。"}),
  Q("rs12","数学 問題3(1)","ウ","exact",{hint:"カタカナの記号"}),
  Q("rs13","数学 問題3(2)","80","exact",{hint:"数字",exp:"錯角50° → 二等分で∠BCD=100° → ∠ABC=80°。"}),
  Q("rs14","数学 問題3(3)①","3","exact",{hint:"数字",exp:"AD:AB=6:18=1:3 → DE=9×1/3=3。"}),
  Q("rs15","数学 問題3(3)②","234√3π","ai",{rule:"234√3π なら正解。",exp:"AE=3√3、AC=9√3。243√3π−9√3π。高さに9を使うと108π（テストの答え）。"}),
  Q("rs16","数学 問題4(1)","16","exact",{hint:"数字",exp:"1+3+5+7=16（全部で）。"}),
  Q("rs17","数学 問題4(2)","2n²+n","ai",{rule:"2n²+n と同じなら正解。",exp:"n=1→3、n=2→10 を入れて確かめる。"}),
  Q("rs18","数学 問題5(1)","イエ","c"),
  Q("rs19","数学 問題5(2)","16","exact",{hint:"数字"}),
  Q("rs20","数学 問題5(3)①","(-1,1/2)","ai",{rule:"(−1, 1/2) なら正解。"}),
  Q("rs21","数学 問題5(3)②","a=4","ai",{rule:"2a=½a² の式から a=4 を出していれば正解。a=0 を残していたら不正解。",big:true,exp:"AB=2a、AC=½a² → a²−4a=0 → a=0,4 → a>0 なので a=4。"}),
  Q("rs22","数学 問題6","証明","ai",{big:true,rule:"2つの奇数を 2n−1,2n+1（または 2n+1,2n+3）と置き、積に1をたして 4×(整数) の形にし、4の倍数と結論していれば正解。",exp:"(2n−1)(2n+1)+1=4n²。n²は整数なので4の倍数。"}),
  Q("rs23","数学 問題7(1)","証明","ai",{big:true,rule:"△ABCと△EDCで、∠BAC=∠DEC=90°（角は3文字）、∠Cが共通、「2組の角がそれぞれ等しい」から相似と結論していれば正解。",exp:"角は ∠BAC のように3文字で書く（テストは∠Aで減点）。"}),
  Q("rs24","数学 問題7(2)","証明","ai",{big:true,rule:"△CDEと△HFGで、∠DEC=∠FGH=90°、四角形FHCDが平行四辺形なので DC=FH、同位角で ∠DCE=∠FHG、「直角三角形の斜辺と1つの鋭角がそれぞれ等しい」から合同と結論していれば正解。",exp:"FD∥BC、FH∥AC → 平行四辺形 → DC=FH。FH∥DC → 同位角。"})
],
rika: [
  Q("rr01","理科 問題1(1)","光","exact",{hint:"漢字"}),
  Q("rr02","理科 問題1(2)","ウ網膜カうずまき管","ai",{rule:"Y=ウ・網膜、Z=カ・うずまき管がすべて正しければ正解（記号と名称の完答）。",exp:"レンズ（イ）は光を曲げるだけ。受けとるのは網膜。"}),
  Q("rr03","理科 問題1(3)","感覚神経","exact",{hint:"漢字"}),
  Q("rr04","理科 問題1(4)","B","exact",{hint:"アルファベット"}),
  Q("rr05","理科 問題1(5)","反射","exact",{hint:"漢字"}),
  Q("rr06","理科 問題1(6)","経路が短いから","ai",{rule:"「刺激から反応までの経路が短い」または「脳を通らず脊髄から命令が出る」内容なら正解。",exp:"テストの「脳に伝わる前に反応する」は×。"}),
  Q("rr07","理科 問題2(1)","ア b イ d","ai",{rule:"アが b、イが d なら正解。"}),
  Q("rr08","理科 問題2(2)","染色体","exact",{hint:"漢字"}),
  Q("rr09","理科 問題2(3)","アオウエイ","exact",{hint:"カタカナの記号",exp:"中央に並ぶ（ウ）→ 両端へ（エ）の順。"}),
  Q("rr10","理科 問題2(4)","体細胞分裂","exact",{hint:"漢字",exp:"減数分裂は生殖細胞をつくるとき。"}),
  Q("rr11","理科 問題2(5)","数・大きく","ai",{rule:"アが数、イが大きく なら正解。"}),
  Q("rr12","理科 問題2(6)","アエ","c",{exp:"受精卵は分裂ごとに1つ1つ小さくなる。オタマジャクシ（えさを食べる）は胚ではない。"}),
  Q("rr13","理科 問題3(1)","凝灰岩","exact",{hint:"漢字"}),
  Q("rr14","理科 問題3(2)","れき・泥岩","ai",{rule:"アが れき、イが 泥岩 なら正解。",exp:"重い粒から沈む。下の層ほど古い。"}),
  Q("rr15","理科 問題3(3)","海の深さがだんだん浅くなった","ai",{rule:"「海が浅くなった」内容なら正解。"}),
  Q("rr16","理科 問題3(4)","石灰岩","exact",{hint:"漢字"}),
  Q("rr17","理科 問題3(5)","イ","exact",{hint:"カタカナの記号"}),
  Q("rr18","理科 問題3(6)","古生代","exact",{hint:"漢字"}),
  Q("rr19","理科 問題4(1)","上昇する","ai",{rule:"上昇する（上がる）なら正解。"}),
  Q("rr20","理科 問題4(2)","イ","exact",{hint:"カタカナの記号"}),
  Q("rr21","理科 問題4(3)","ウ","exact",{hint:"カタカナの記号"}),
  Q("rr22","理科 問題4(4)","体積・温度・露点","ai",{rule:"ア体積、イ温度、ウ露点 がすべて正しければ正解。露点が漢字でなくても可。"}),
  Q("rr23","理科 問題4(5)","温度が上がって水滴が水蒸気に変わるから","ai",{rule:"「温度が上がる」と「水滴が水蒸気になる」の両方があれば正解。"}),
  Q("rr24","理科 問題4(6)","積乱雲","exact",{hint:"漢字"}),
  Q("rr25","理科 問題5(1)","水上置換法","exact",{hint:"漢字",exp:"テストは上方置換法。"}),
  Q("rr26","理科 問題5(2)","はじめは装置内の空気が出てくるから","ai",{rule:"「はじめは（三角フラスコ・装置の）空気が出てくる」内容なら正解。"}),
  Q("rr27","理科 問題5(3)","二酸化炭素","exact",{hint:"漢字"}),
  Q("rr28","理科 問題5(4)","イ","exact",{hint:"カタカナの記号",exp:"酸化銀の加熱で酸素。"}),
  Q("rr29","理科 問題5(5)","気圧・赤色・アルカリ","ai",{rule:"ア気圧、イ赤色、ウアルカリ がすべて正しければ正解。"}),
  Q("rr30","理科 問題6(1)","薬品や廃液の量を少なくできる","ai",{rule:"「使う薬品（廃液）の量が少ない」内容なら正解。"}),
  Q("rr31","理科 問題6(2)","ZnSO4→Zn2++SO42-","ai",{rule:"ZnSO₄ → Zn²⁺ + SO₄²⁻ と同じなら正解。電荷がなければ不正解。"}),
  Q("rr32","理科 問題6(3)","陽イオン・受けとり","ai",{rule:"ア陽イオン、イ受けとり なら正解。"}),
  Q("rr33","理科 問題6(4)","亜鉛","exact",{hint:"漢字"}),
  Q("rr34","理科 問題6(5)","オ","exact",{hint:"カタカナの記号"}),
  Q("rr35","理科 問題6(6)","Ag","exact",{hint:"アルファベット",exp:"銅がとけて銀が出る。"}),
  Q("rr36","理科 問題7(1)","回路に大きな電流が流れないようにするため","ai",{rule:"「大きな電流が流れないように（ショートしないように）」なら正解。"}),
  Q("rr37","理科 問題7(2)","磁界の向き","ai",{rule:"磁界の向きなら正解（ひらがな可）。"}),
  Q("rr38","理科 問題7(3)","イ","exact",{hint:"カタカナの記号"}),
  Q("rr39","理科 問題7(4)","a","exact",{hint:"アルファベット小文字"}),
  Q("rr40","理科 問題7(5)","電源の電圧を大きくする","ai",{rule:"電流を大きくする内容（電圧を上げる・抵抗を小さく）なら正解。"}),
  Q("rr41","理科 問題7(6)","イエ","c",{exp:"発電機・マイク＝電磁誘導。"}),
  Q("rr42","理科 問題8(1)","91","exact",{hint:"数字",exp:"6打点=0.1秒。9.1÷0.1=91。"}),
  Q("rr43","理科 問題8(2)","作図","self",{q:"問題用紙の<b>理科 問題8(2)</b>の作図をもう一度。重力を対角線にした長方形をかき、斜面に平行・垂直な分力を作図。",exp:"重力の矢印を対角線にする長方形（平行四辺形）をかく。"}),
  Q("rr44","理科 問題8(3)","平行・一定の大きさで","ai",{rule:"ア平行、イ一定の大きさで なら正解。"}),
  Q("rr45","理科 問題8(4)","ア","exact",{hint:"カタカナの記号"}),
  Q("rr46","理科 問題8(5)","等速直線運動","exact",{hint:"漢字"}),
  Q("rr47","理科 問題8(6)","イ","exact",{hint:"カタカナの記号"})

  { id:"m8-2", q:"地層の逆転がないとき、いちばん古い層は上と下のどちら？", a:["下"], m:"exact", hint:"漢字1字", exp:"下。上に重なるほど新しい。" },
  { id:"m8-3", q:"アンモナイトの化石をふくむ地層ができた地質年代は？", a:["中生代"], m:"exact", hint:"漢字", exp:"中生代（恐竜・アンモナイト）。フズリナ・サンヨウチュウ＝古生代、ビカリア＝新生代。" },

  { id:"m8-6", q:"銅イオン Cu²⁺ が亜鉛から電子を「受けとる」か「うばわれる」か。", a:["受けとる"], m:"ai", rule:"「受けとる（受け取る）」なら正解。", exp:"陽イオンが電子を2個受けとって銅原子になる。" },

{ id:"m10", day:"mon", slot:3, subj:"eigo", type:"drill", min:20, title:"②④ 英語の文法（後ろから説明・間接疑問）", voice:"ポイントは5つ。名詞は後ろから説明できる。ウィズ、過去分詞、アイエヌジーのかたまり、ネームド。された、は過去分詞1語で、ワズはつけない。ドゥユーノウのあとは、疑問詞、主語、動詞の順。経験がないは、ハブ、ネバー、ビーン。発音は、つづりではなく音で判断する。",
  points:[
    "<b>名詞を後ろから説明する</b>：the boy <u>with</u> blue eyes／the computer <u>bought</u> by my sister（過去分詞）／the boy <u>running</u> over there（-ing＋語句）／a dog <u>named</u> Shiro。",
    "「〜された」は過去分詞1語。<b>was bought はつけない</b>（文の動詞になってしまう）。",
    "<b>間接疑問</b>：Do you know＋<u>疑問詞＋主語＋動詞</u>？ → Do you know what sport Seiya plays?（does は消える）",
    "<b>経験の否定</b>：I have <u>never been</u> there.",
    "<b>発音</b>はつづりではなく音で：know[ou]／now[au]。that と this の th は同じ音。"
  ],
  items:[
  { id:"m10-1", q:"( )に1語：Look at the girl ( ) long hair.", a:["with"], m:"exact", hint:"英単語", exp:"with long hair＝長い髪をした。" },
  { id:"m10-2", q:"( )に1語（write を適切な形に）：This is a letter ( ) by my grandmother.", a:["written"], m:"exact", hint:"英単語", exp:"written＝書かれた（過去分詞）。" },
  { id:"m10-3", q:"( )に1語（take を適切な形に）：These are pictures ( ) in Kyoto.", a:["taken"], m:"exact", hint:"英単語", exp:"taken＝撮られた。" },
  { id:"m10-4", q:"並べかえて全文を書こう：( the / over / girl / there / dancing ) is my sister.", a:["The girl dancing over there is my sister."], m:"ai", rule:"The girl dancing over there is my sister. と同じ語順なら正解。文頭の大文字・ピリオドは問わない。", exp:"girl を dancing over there が後ろから説明。" },
  { id:"m10-5", q:"並べかえて全文を書こう：( you / where / know / do / lives / Ken )?", a:["Do you know where Ken lives?"], m:"ai", rule:"Do you know where Ken lives? と同じ語順なら正解。", exp:"where＋Ken＋lives（主語＋動詞）の順。does は使わない。" },
  { id:"m10-6", q:"並べかえて全文を書こう：( what / she / I / bought / know / don't ).", a:["I don't know what she bought."], m:"ai", rule:"I don't know what she bought. と同じ語順なら正解。", exp:"what＋she＋bought。" },
  { id:"m10-7", q:"並べかえて全文を書こう：( remember / you / do / said / what / Mika )?", a:["Do you remember what Mika said?"], m:"ai", rule:"Do you remember what Mika said? と同じ語順なら正解。", exp:"Do you remember の後ろに what＋Mika＋said。" },
  { id:"m10-8", q:"英語にしよう：わたしは一度も北海道に行ったことがない。", a:["I have never been to Hokkaido."], m:"ai", rule:"I have never been to Hokkaido. と同じ意味・文法なら正解（I've も可）。gone は不正解。", exp:"have never been to 〜。" },
  { id:"m10-9", q:"同じ発音でつづりがちがう語：「買う」と「〜のそばに」", a:["buy, by"], m:"ai", rule:"buy と by の両方が正しいつづりなら正解。", exp:"buy / by。ほかに know/no、right/write、meet/meat、see/sea。" },
  { id:"m10-10", q:"同じ発音でつづりがちがう語：「聞く」と「ここに」", a:["hear, here"], m:"ai", rule:"hear と here の両方が正しいつづりなら正解。", exp:"hear / here。" },
  { id:"m10-11", q:"( )に1語：Are you interested ( ) Japanese culture?", a:["in"], m:"exact", hint:"英単語", exp:"be interested in 〜＝〜に興味がある。" },
  { id:"m10-13", ref:"英語 問題4(1)", q:"( )に1語ずつ：「あの男の人がだれか知っている？」 Do you know ( ) that man ( )?", a:["who, is"], m:"ai", rule:"1つ目が who、2つ目が is なら正解。", exp:"Do you know who that man is? 間接疑問は 疑問詞＋主語＋動詞。is は最後。" },
  { id:"m10-14", ref:"英語 問題4(3)", q:"( )に2語：「何時に起きればいいかわからない」 I don't know ( ) ( ) to get up.", a:["what time"], m:"ai", rule:"what time なら正解。", exp:"what time to 〜＝何時に〜すればよいか。" },

{ id:"t4", day:"tue", slot:1, subj:"eigo", type:"listen", min:10, title:"英語リスニング（NEW HORIZON 3年の場面）",
  lead:"▶で英語が流れる。1問につき2回まで聞ける。答えは日本語か英語で短く書く。",
  items:[
  { id:"t4-1", say:[["A","Kenta, what are you going to do this weekend?"],["B","I'm going to clean the beach with my volunteer club on Saturday. On Sunday, I'll study for the test."]], q:"ケンタは土曜日に何をする？", a:["ボランティア部で海岸のそうじ"], m:"ai", rule:"「海岸（ビーチ）のそうじ（清掃）」の内容があれば正解。", exp:"clean the beach with my volunteer club。" },
  { id:"t4-2", say:[["A","How long have you lived in Japan, Ms. Brown?"],["B","I have lived here for five years. I came here when I was twenty-five."]], q:"ブラウン先生は日本に何年住んでいる？", a:["5年"], m:"ai", rule:"5年なら正解。", exp:"for five years。25歳は来たときの年齢。" },
  { id:"t4-3", say:[["A","Which do you like better, summer or winter?"],["B","I like winter better because I can go skiing with my family."]], q:"Bが冬のほうが好きな理由は？", a:["家族とスキーに行けるから"], m:"ai", rule:"「（家族と）スキーに行ける」内容なら正解。", exp:"because I can go skiing with my family。" },
  { id:"t4-4", say:[["A","Excuse me. Could you tell me how to get to the station?"],["B","Sure. Go straight and turn left at the second corner. You'll see it on your right."]], q:"駅へは、何番目の角をどちらに曲がる？", a:["2番目の角を左"], m:"ai", rule:"「2番目の角」と「左」の両方があれば正解。", exp:"turn left at the second corner。" },
  { id:"t4-5", say:[["N","Our class visited Kyoto on the school trip. We saw many old temples. I was most impressed by Kinkakuji. I want to visit Kyoto again with my family."]], q:"話した人がいちばん感動したものは？", a:["金閣寺"], m:"ai", rule:"金閣寺（Kinkakuji）なら正解。", exp:"I was most impressed by Kinkakuji。" },
  { id:"t4-6", say:[["A","Have you finished your homework yet, Yuki?"],["B","Not yet. I've just finished the math homework. I still have English homework."]], q:"ユキがまだ終わっていない宿題は何の教科？", a:["英語"], m:"ai", rule:"英語なら正解。", exp:"I still have English homework。math は終わった。" },
  { id:"t4-7", say:[["N","Some people say AI will take our jobs. I think AI is a useful tool. It can help doctors find diseases faster. But people should make the final decisions."]], q:"話した人は、最後に決めるのはだれだと言っている？", a:["人（人間）"], m:"ai", rule:"人・人間（people）なら正解。", exp:"people should make the final decisions。" },
  { id:"t4-8", say:[["A","The movie starts at three. Let's meet at two thirty in front of the theater."],["B","OK. But the bus is often late, so let's meet at two fifteen."]], q:"二人は最終的に何時に会う？", a:["2時15分"], m:"ai", rule:"2時15分（2:15）なら正解。", exp:"最後に two fifteen に変えた。最後まで聞いて答える。" }
  ]},

{ id:"t1", day:"tue", slot:1, subj:"shakai", type:"drill", min:15, title:"②④ 社会 公民の補強", voice:"ポイントは5つ。人権は、自由権、社会権、参政権。教育を受ける権利は社会権。憲法改正は、3分の2以上で発議して、国民投票で過半数。選挙の4原則は、普通、平等、秘密、直接。きまりは公職選挙法。国会は、常会、臨時会、特別会。記述は、指定の言葉を必ず使って、からで終わる。",
  points:[
    "<b>人権</b>：自由権（表現・身体・経済の自由）／社会権（生存権・教育を受ける権利・勤労の権利）／参政権。",
    "<b>憲法改正</b>：各議院の総議員の3分の2以上で発議 → 国民投票で<b>過半数</b>の賛成。",
    "<b>選挙の4原則</b>：普通・平等・秘密・直接。きまりは<b>公職選挙法</b>。一票の価値の差＝<b>一票の格差</b>。",
    "<b>国会</b>：常会（毎年1月）／臨時会（内閣か、どちらかの議院の総議員の4分の1以上の要求）／特別会（衆議院の総選挙から30日以内）／参議院の緊急集会。",
    "<b>記述のコツ</b>：指定語句は必ず使う。「〜から。」で終わる。"
  ],
  items:[
  { id:"t1-1", ref:"社会 問題2(2)", q:"選挙区・議員定数など、選挙のしくみを定めた法律（漢字）", a:["公職選挙法"], m:"exact", hint:"漢字", exp:"公職選挙法。テストは「普通選挙法」を選んだ（そんな法律の名前はない）。" },
  { id:"t1-2", ref:"社会 問題1(2)", q:"「教育を受ける権利」は自由権・社会権・参政権のどれ？", a:["社会権"], m:"exact", hint:"漢字", exp:"社会権（人間らしい生活の保障）。表現の自由・逮捕に令状が必要＝自由権。" },
  { id:"t1-3", ref:"社会 問題1(4)a", q:"国民の義務が3つしかないのはなぜ？「国民」という言葉を使って", a:["憲法は国の権力を制限して、国民の権利を守るためのものだから"], m:"ai", rule:"「憲法は国（政府・権力）をしばる／国民の権利（人権）を守るためのもの」という内容があり、「国民」を使っていれば正解。", exp:"憲法は国民が国に守らせるきまり（立憲主義）。だから国民の義務は最小限。三大義務＝子どもに教育を受けさせる・勤労・納税。" },
  { id:"t1-4", ref:"社会 問題1(4)b", q:"国民投票で有効投票総数が8000万票。改正案の承認に必要な最低の賛成票は？", a:["4000万1票"], m:"ai", rule:"4000万1票（40000001票）なら正解。4000万票ちょうどは不正解。", exp:"過半数＝半分より多い → 4000万＋1票。テストは「＋1」を落とした。半分ちょうどは過半数ではない。" },
  { id:"t1-5", ref:"社会 問題3(4)a", q:"禁中並公家諸法度を定めて朝廷を統制したのは、江戸時代の初め・中ごろ・終わりのどれ？", a:["初め"], m:"ai", rule:"「初め（初期・17世紀初め・家康や秀忠のころ）」なら正解。", exp:"1615年、江戸時代の初め。吉宗（享保の改革）は1716年〜なので、ウが誤り。" },
  { id:"t1-6", ref:"社会 問題6(2)", q:"オーストラリア大陸の中ほど、南緯約23度を通る緯線の名前（漢字）", a:["南回帰線"], m:"exact", hint:"漢字", exp:"南回帰線。赤道はオーストラリアよりずっと北。人口10万以上の都市は沿岸部・南回帰線より南に多い。" },
  { id:"t1-7", ref:"社会 問題5(2)", q:"農耕・文字・金属器・火薬のうち、古代文明に共通する特徴ではないものは？", a:["火薬"], m:"exact", hint:"漢字", exp:"火薬は3〜7世紀の中国で発明。古代文明より後。" },
  { id:"t1-8", ref:"社会 問題4(4)", q:"コロンブスの西インド諸島到達（1492年）に近い時代の日本の出来事は？ 遣唐使の派遣／琉球王国の成立／ペリーの来航", a:["琉球王国の成立"], m:"ai", rule:"琉球王国の成立なら正解。", exp:"琉球王国の成立は1429年（15世紀）。だから3班。テストは1班（旧石器時代）を選んだ。年表を思い出してから選ぶ。" },
  { id:"t1-9", ref:"社会 問題2(5)", q:"衆議院の総選挙の日から30日以内に召集される国会", a:["特別会"], m:"exact", hint:"漢字", exp:"特別会（特別国会）。内閣総理大臣を指名する。" },
  { id:"t1-10", ref:"社会 問題2(5)", q:"内閣が必要と認めたとき、またはいずれかの議院の総議員の4分の1以上の要求で召集される国会", a:["臨時会"], m:"exact", hint:"漢字", exp:"臨時会（臨時国会）。" },
  { id:"t1-11", ref:"社会 問題2(3)b", q:"ある選挙の投票率：全体50%、20歳代35%、50歳代58%、60歳代68%、70歳代以上60%。全体の投票率を上回るのはどの年代？", a:["50歳代・60歳代・70歳代以上"], m:"ai", rule:"50歳代・60歳代・70歳代以上の3つがそろっていれば正解。", exp:"表の数字を1つずつ全体と比べる。グラフや表の問題は「最も高い・低い」の差も数字で確かめる（テストはアを読み切れなかった）。" },
  { id:"t1-12", ref:"社会 問題5(1)", q:"たて穴住居・高床倉庫・ヤマト王権の大王。縄文〜弥生時代のことでないものは？", a:["ヤマト王権の大王"], m:"ai", rule:"ヤマト王権（大王）を選んでいれば正解。", exp:"ヤマト王権は古墳時代。たて穴住居＝縄文〜、高床倉庫＝弥生（稲作）。" },
  { id:"t1-14", ref:"社会 問題3(4)b", q:"オランダだけ来航が続けられた理由（「布教」を使って）", a:["キリスト教の布教を行わなかったから"], m:"ai", rule:"「布教をしない（行わない）」内容なら正解。「布教した」は不正解。", exp:"テストは「布教したから」と逆に書いた。オランダはキリスト教を広めなかったので出島で貿易を許された。" },
  { id:"t1-15", ref:"社会 問題5(4)", q:"太閤検地で百姓に課された義務（「石高」を使って）", a:["石高に応じて年貢を納める"], m:"ai", rule:"「石高に応じた（基づく）年貢を納める」内容なら正解。", exp:"検地帳に登録 → 耕す権利が保障され、その代わり石高に応じた年貢を納める。" },
  { id:"t1-16", ref:"社会 問題5(5)", q:"元禄文化のころ「見返り美人図」をえがいた人物", a:["菱川師宣"], m:"exact", hint:"漢字", exp:"菱川師宣（ひしかわもろのぶ）。浮世絵。" },
  { id:"t1-17", ref:"社会 問題7(2)", q:"十日町で米が単作になる理由（「冬」を使って）", a:["冬は積雪の期間が長く農作業ができないため"], m:"ai", rule:"「冬は雪が多い（積雪期間が長い）」内容があれば正解。「寒い」だけは不正解。", exp:"テストは「冬の寒さに弱い」。北陸は冬の雪 → 副業で地場産業が発達。" },
  { id:"t1-13", ref:"社会 問題6(5)", q:"東経135度の日本が午前10時のとき、東経180度の国は何時？（午前・午後をつけて）", a:["午後1時"], m:"ai", rule:"午後1時（13時）なら正解。", exp:"経度差45度÷15=3時間。東のほうが進んでいる → 午後1時。<br>テストは「午後13時」と書いて×。計算は合っていた！「午後」をつけたら12を引く。" }
  ]},

{ id:"t2", day:"tue", slot:1, subj:"kokugo", type:"drill", min:15, title:"②④ 国語 漢字・古文の補強", voice:"ポイントは4つ。歴史的仮名遣いは、語中のはひふへほを、わいうえおに。ぢとづは、じとず。こその結びは已然形。うつくしは、かわいらしい。熟語は、にた意味、反対の意味、上が下を修飾、などの組み立てを見る。",
  lead:"国語は解答用紙が届いたら、記述のやり直しを追加します。今日は落とせない基本から。",
  points:[
    "<b>歴史的仮名遣い</b>：語中・語末のは行→わ行（おはする→おわする）、ぢ・づ→じ・ず（はづかし→はずかし）、ゐ・ゑ・を→い・え・お、au→ô（やうやう→ようよう）。",
    "<b>係り結び</b>：ぞ・なむ・や・か → 連体形、<b>こそ → 已然形</b>（ゆゑあり → こそゆゑあれ）。",
    "<b>古語</b>：あやし＝不思議だ、いと＝とても、うつくし＝かわいい、をかし＝趣がある、みめ＝見た目。",
    "<b>熟語の構成</b>：似た意味（狩猟・製造）／反対（高低）／上が下を修飾（国立は主語＋述語）／動詞＋目的語（登山）。"
  ],
  items:[
  { id:"t2-1", ref:"国語 問題一(一)", q:"漢字で書こう：新しいシステムに【イコウ】する。", a:["移行"], m:"exact", hint:"漢字", exp:"移行。" },
  { id:"t2-2", ref:"国語 問題一(一)", q:"漢字で書こう：友だちのひと言に【スク】われる。", a:["救"], m:"exact", hint:"漢字（送り仮名があればひらがなも）", exp:"救われる。" },
  { id:"t2-3", ref:"国語 問題一(一)", q:"漢字で書こう：【バンカン】の思いをこめる。", a:["万感"], m:"exact", hint:"漢字", exp:"万感（ばんかん）＝心にわき起こるさまざまな思い。" },
  { id:"t2-4", ref:"国語 問題一(一)", q:"漢字で書こう：雪が【フ】り【ツ】もる。（「ふりつもる」をすべて）", a:["降り積もる"], m:"exact", hint:"漢字とひらがな", exp:"降り積もる。" },
  { id:"t2-5", ref:"国語 問題三(一)", q:"読みをひらがなで：【余暇】を楽しむ。", a:["よか"], m:"exact", hint:"ひらがな", exp:"よか（仕事のない自由な時間）。" },
  { id:"t2-6", ref:"国語 問題三(一)", q:"読みをひらがなで：【永く】使う。（送り仮名まで）", a:["ながく"], m:"exact", hint:"ひらがな", exp:"ながく。テストは「ながらく」。" },
  { id:"t2-6b", q:"漢字で書こう：時代の【スイイ】を調べる。", a:["推移"], m:"exact", hint:"漢字", exp:"推移。" },
  { id:"t2-7", ref:"国語 問題二(一)", q:"現代仮名遣いで（ひらがな）：おはする", a:["おわする"], m:"exact", hint:"ひらがな", exp:"語中の「は」→「わ」。" },
  { id:"t2-8", q:"現代仮名遣いで（ひらがな）：あはれなり", a:["あわれなり"], m:"exact", hint:"ひらがな", exp:"は→わ。" },
  { id:"t2-9", q:"現代仮名遣いで（ひらがな）：やうやう", a:["ようよう"], m:"exact", hint:"ひらがな", exp:"「やう」→「よう」（au→ô）。" },
  { id:"t2-10", q:"現代仮名遣いで（ひらがな）：まゐる", a:["まいる"], m:"exact", hint:"ひらがな", exp:"ゐ→い。" },
  { id:"t2-11", ref:"国語 問題二(三)", q:"文末が已然形（〜れ・〜け など）に変わる係りの助詞は？", a:["こそ"], m:"exact", hint:"ひらがな", exp:"こそ → 已然形。ぞ・なむ・や・か → 連体形。" },
  { id:"t2-12", q:"古語「うつくし」の意味を現代語で", a:["かわいらしい"], m:"ai", rule:"「かわいい・かわいらしい・愛らしい」なら正解。「美しい」は不正解。", exp:"うつくし＝かわいらしい。" },
  { id:"t2-13", ref:"国語 問題三(二)", q:"「狩猟」と同じ構成の熟語：登山・高低・国立・製造", a:["製造"], m:"exact", hint:"漢字", exp:"狩猟・製造はどちらも似た意味の字の組み合わせ。" },
  { id:"t2-15", ref:"国語 問題一(三)", q:"問題用紙の<b>問題一(三)</b>をもう一度。本文の「サイダーハウス・ルール」の段落を読んで、20〜30字・「〜から」で。", a:["読んだ小説の主人公の苛々を、綾も感じていたと想像したから"], m:"ai", rule:"「小説の登場人物（主人公）と同じ苛々を綾も感じていたと想像した」内容で、文末が「から」なら正解。", exp:"傍線部の理由は、すぐ後の「それは〜から」の段落にある。指示語「それは」の後ろを探す（テストでは○をつけていたのに使えなかった）。" },
  { id:"t2-14", ref:"国語 問題二(一)イ", q:"現代仮名遣いで（ひらがな）：はづかし", a:["はずかし"], m:"exact", hint:"ひらがな", exp:"「づ」→「ず」。テストは「はづかしい」と、直さずに「い」までつけた。古文の形（はずかし）のまま書く。" },

<script>

function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
/* APIキーは、同じサイトの手書き一問一答（kijutsu250）で入れたものを使う */
function apiKey(){

}

}
load();

/* ============================================================
   ホーム
   ============================================================ */
const $ = id => document.getElementById(id);
function color(s){ return `var(--${s})`; }
function blocksOf(day){ return BLOCKS.filter(b=>b.day===day); }
function toMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function fmtClock(min){ const h=Math.floor(min/60), m=min%60; return `${h}:${String(m).padStart(2,"0")}`; }
function dayTotal(d){ return DAYS[d].slots.length*60; }

function renderHome(){
  $("tabs").innerHTML = Object.keys(DAYS).map(d=>{
    if(d==="wed") return `<button class="tab ${store.day===d?"on":""}" onclick="pickDay('wed')">${DAYS[d].label}<small>まだ✕ ${remaining().length}問</small></button>`;
    const bs=blocksOf(d).filter(b=>b.slot!=null), done=bs.filter(b=>store.blocks[b.id]?.done).length;
    return `<button class="tab ${store.day===d?"on":""}" onclick="pickDay('${d}')">${DAYS[d].label}<small>${dayTotal(d)/60}時間・${done}/${bs.length} 終了</small></button>`;
  }).join("");
  if(store.day==="wed") return renderWed();
  const bs = blocksOf(store.day);
  const sched = bs.filter(b=>b.slot!=null);
  let doneMin=0, html="", fo=bs.indexOf(sched[firstOpen(sched)]);
  DAYS[store.day].slots.forEach((sl,si)=>{
    const inSlot = bs.filter(b=>b.slot===si);
    html += `<div class="slothead">${sl[0]}〜${sl[1]}</div>`;
    let t=toMin(sl[0]);
    html += inSlot.map(b=>{
    const i=bs.indexOf(b);
    const st = store.blocks[b.id]||{};
    const start=t; t+=b.min; if(st.done) doneMin+=b.min;
    const label = st.done ? (st.score!=null ? `済 ${st.score}` : "済") : (i===fo ? "▶ つぎ" : "");
    return `<div class="blk ${st.done?"done":""}" style="--c:${color(b.subj)}">
      <div class="tm"><b>${fmtClock(start)}〜</b>${b.min}分</div>
      <div class="tt">${b.title}<small>${SUBJ[b.subj]}${b.items?`・${b.items.length}問`:""}${b.type==="explain"?"　👪 おうちの人が聞く":""}</small></div>
      <div class="st">${label}</div>
      <button class="btn sm ${st.done?"":"primary"}" onclick="startBlock('${b.id}')">${st.done?"もう一度":"はじめる"}</button>
    </div>`;
    }).join("");
    const next=DAYS[store.day].slots[si+1];
    if(next){ const gap=toMin(next[0])-toMin(sl[1]); html += `<div class="gap">${gap>=60?"🍚 夕食・休けい":"☕ 休けい"}（${gap}分）${gap<60?"：立つ・水を飲む・顔を洗う。スマホは見ない。":""}</div>`; }
  });
  const opt = bs.filter(b=>b.slot==null);
  if(opt.length){
    html += `<div class="slothead" style="color:var(--sub)">＋ 時間があれば（予定外・やらなくてもOK）</div>`;
    html += opt.map(b=>{ const st=store.blocks[b.id]||{};
      return `<div class="blk ${st.done?"done":""}" style="--c:${color(b.subj)}">
      <div class="tm"><b>任意</b>${b.min}分</div>
      <div class="tt">${b.title}<small>${SUBJ[b.subj]}${b.items?`・${b.items.length}問`:""}</small></div>
      <div class="st">${st.done?(st.score?`済 ${st.score}`:"済"):""}</div>
      <button class="btn sm" onclick="startBlock('${b.id}')">${st.done?"もう一度":"はじめる"}</button></div>`; }).join("");
  }
  $("blockList").innerHTML = html;
  $("dayBar").style.width = Math.round(doneMin/dayTotal(store.day)*100)+"%";
  $("modeNote").innerHTML = (apiKey()
    ? "採点：<b>AI採点</b>（手書き一問一答と同じ Gemini キーを使用）"
    : "採点：<b>自己採点</b>（⚙設定で Gemini APIキーを入れるとAI採点）")
    + "<br>①は問題用紙を見ながら解きます。問題用紙の文章はこのアプリには入っていません。";
}
function renderWed(){
  const SUBJS=["sugaku","rika","eigo","shakai","kokugo"];
  const rem=remaining(); const tot=rem.length;
  let html=`<div class="card"><div style="font-size:18px;font-weight:800">11/18（水）弱点補強</div>
    <div class="lead">月曜・火曜でまちがえて、まだ直っていない問題が自動でここに集まります。<b>今 ${tot}問</b>（目安 ${Math.ceil(tot*1.2)}分）。<br>
    火曜が終わったら「📖 記録」→「この端末に保存」「Googleドライブに保存」を押してください。その分析を見て、水曜の時間割と類似問題を組み直します。</div></div>`;
  SUBJS.forEach(sj=>{

    html+=`<div class="blk" style="--c:${color(sj)}"><div class="tm"><b>${n}問</b>目安${Math.ceil(n*1.2)}分</div>
      <div class="tt">${b.title}<small>まだ✕の問題だけ</small></div><div class="st"></div>
      <button class="btn sm ${n?"primary":""}" ${n?"":"disabled"} onclick="startBlock('w-${sj}')">はじめる</button></div>`;
  });
  html+=`<div class="slothead">✍ 書く練習（テストで0点だったところ）</div>`;
  BLOCKS.filter(x=>x.day==="wed"&&x.type!=="weak").forEach(b=>{ const st=store.blocks[b.id]||{};
    html+=`<div class="blk ${st.done?"done":""}" style="--c:${color(b.subj)}"><div class="tm"><b>${b.items.length}問</b>目安${b.min}分</div>
      <div class="tt">${b.title}<small>${SUBJ[b.subj]}</small></div><div class="st">${st.done?(st.score?`済 ${st.score}`:"済"):""}</div>
      <button class="btn sm ${st.done?"":"primary"}" onclick="startBlock('${b.id}')">${st.done?"もう一度":"はじめる"}</button></div>`; });
  html+=`<div class="note">📌 週末か来週に、月・火の「① 全問やり直し」をもう一度やると、前回との速さの比較が出ます（定着とスピードの確認）。</div>`;
  $("blockList").innerHTML=html; $("dayBar").style.width="0%";
  $("modeNote").innerHTML="水曜の時間割は、火曜の結果を見て決めます。";
}
function firstOpen(bs){ const i=bs.findIndex(b=>!store.blocks[b.id]?.done); return i; }
function pickDay(d){ store.day=d; save(); renderHome(); }

/* ============================================================
   ブロックの実行
   ============================================================ */
let run=null, clockTimer=null;
function startBlock(id){
  let b = BLOCKS.find(x=>x.id===id);
  run = { b, t0:Date.now(), idx:0, queue:[], round:1, ok:0, n:0, phase:"intro" };
  if(b.type==="mix"||b.type==="weak") run.items = mixItems(b);
  else run.items = (b.items||[]).slice();
  if(b.type==="weak"){ run.b = Object.assign({}, b, { min: Math.max(5, Math.ceil(run.items.length*1.2)) }); }
  run.per = Math.max(15, Math.round(run.b.min*60/Math.max(1,run.items.length))); run.times=[]; run.qt0=null;
  $("home").classList.add("hidden"); $("run").classList.remove("hidden");
  document.documentElement.style.setProperty("--c", color(b.subj));
  $("rTag").textContent = SUBJ[b.subj]; $("rTag").style.background = color(b.subj);
  clearInterval(clockTimer); clockTimer=setInterval(tick,1000); tick();
  showIntro();
}
function tick(){
  if(!run) return;
  const sec=Math.floor((Date.now()-run.t0)/1000), lim=run.b.min*60;
  if(run.b.type==="break"){
    const left=Math.max(0,lim-sec);
    $("rClock").textContent = `のこり ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
    const big=$("breakLeft"); if(big) big.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
    if(left===0 && !run.rang){ run.rang=true; beep(); }
    $("rClock").classList.remove("over"); return;
  }
  $("rClock").textContent = `${Math.floor(sec/60)}分 / ${run.b.min}分`;
  $("rClock").classList.toggle("over", sec>lim);
  /* 1問ごとの目安バー */
  const bar=$("qPaceBar");
  if(run.qt0 && !run.answered){ const q=(Date.now()-run.qt0)/1000, r=q/run.per;
    bar.style.width=Math.min(100,r*100)+"%"; bar.className = r>1.5?"over":r>1?"warn":""; }
  else if(!run.qt0){ bar.style.width="0%"; }
  /* 予定より早い／遅い（1回目のみ） */
  const pc=$("rPace");
  if(run.round===1 && run.items.length && run.b.type!=="explain" && run.idx>0){
    const diff = Math.round((run.idx*run.per - sec)/60);
    pc.textContent = diff>0 ? `予定より${diff}分早い` : diff<0 ? `予定より${-diff}分おくれ` : "予定どおり";
    pc.className = "pace " + (diff>0?"ahead":diff<0?"behind":"");
  } else { pc.textContent=""; pc.className="pace"; }
}
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); const o=a.createOscillator(); o.frequency.value=880; o.connect(a.destination); o.start(); setTimeout(()=>{o.stop();a.close();},600);}catch(e){} }
function setProg(){
  const tot = (run.round===2 ? run.queue.length : run.items.length)||1;
  $("rProg").style.width = Math.round(Math.min(run.idx,tot)/tot*100)+"%";
  $("rCount").textContent = run.items.length ? `${Math.min(run.idx+1,tot)}/${tot}${run.round>1?"（2回目）":""}` : "";
}
function showIntro(){
  const b=run.b; hidePad(); setProg();
  if(b.type==="break"){
    $("stage").innerHTML = `<div class="card" style="text-align:center"><div class="lead">${b.title}</div>
      <div class="big" id="breakLeft"></div><div class="lead">目を休めて、水を飲もう。</div>
      <div style="margin-top:14px"><button class="btn primary" onclick="finishBlock(null)">休けい終わり</button></div></div>`;
    tick(); return;
  }
  let h = `<div class="card"><div style="font-size:19px;font-weight:800;margin-bottom:8px">${b.title}</div>`;
  if(b.lead) h += `<div class="lead">${b.lead}</div>`;
  if(b.points) h += `<ul class="points">${b.points.map(p=>`<li>${p}</li>`).join("")}</ul>`;
  if(run.items.length && b.type!=="explain"){ const sec=Math.round(b.min*60/run.items.length);
    h += `<div class="hintbox">⏱ ${run.items.length}問を${b.min}分で。目安は<b>1問 ${sec>=60?Math.floor(sec/60)+"分"+(sec%60?sec%60+"秒":""):sec+"秒"}</b>。迷ったら書いて答え合わせ、止まらない。</div>`; }
  if(b.type==="mix" && !run.items.length) h += `<div class="lead" style="margin-top:8px">まちがえた問題はありません！ このブロックは終わりにしてOK。</div>`;
  h += `</div><div class="tools"><button class="btn" id="voiceBtn" onclick="toggleGuide()">🔊 もう一度聞く</button><div class="sp"></div>`;
  h += (b.type==="mix" && !run.items.length)
    ? `<button class="btn primary" onclick="finishBlock(null)">終わる</button>`
    : `<button class="btn primary" onclick="nextItem()">${b.points?"ポイントを読んだ → 問題へ":"はじめる"}</button>`;
  $("stage").innerHTML = h + `</div>`;
  speakGuide();
}

/* ---------- 音声ガイド（最初の説明を読み上げ） ---------- */
function guideText(){
  const b=run.b;
  const num=t=>t.replace(/①/g,"いち、").replace(/②/g,"に、").replace(/③/g,"さん、").replace(/④/g,"よん、").replace(/＋/g,"");
  let t=num(b.title)+"。";
  if(b.lead) t+=b.lead+"。";
  if(b.voice) t+=b.voice;
  else if(b.points) t+="まず、画面のポイントを読もう。";
  if(run.items.length && b.type!=="explain"){ const sec=Math.round(b.min*60/run.items.length);
    t+=`${run.items.length}問を${b.min}分で解きます。目安は1問${sec>=60?Math.floor(sec/60)+"分"+(sec%60?sec%60+"秒":""):sec+"秒"}。迷ったら書いて答え合わせ。止まらずに進もう。`; }
  t=t.replace(/<[^>]+>/g,"").replace(/[（(]/g,"、").replace(/[）)]/g,"、").replace(/→/g,"、").replace(/〜/g,"").replace(/▶/g,"再生ボタン").replace(/／/g,"、")
     .replace(/(\d+)問/g,"$1もん").replace(/、+/g,"、").replace(/、。/g,"。").replace(/。+/g,"。").replace(/「」/g,"");
  return t;
}
function jaVoice(){ const vs=speechSynthesis.getVoices(); return vs.find(v=>/ja/i.test(v.lang)&&/Google|Kyoko|O-ren|Nanami/i.test(v.name))||vs.find(v=>/ja/i.test(v.lang)); }
function speakGuide(){
  if(!("speechSynthesis" in window)) { const vb=$("voiceBtn"); if(vb) vb.remove(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const parts=guideText().split(/(?<=[。！？])/).map(x=>x.trim()).filter(Boolean);
  const v=jaVoice();
  parts.forEach((p,i)=>{ const u=new SpeechSynthesisUtterance(p); u.lang="ja-JP"; if(v) u.voice=v; u.rate=1.05;
    if(i===parts.length-1) u.onend=()=>{ const vb=$("voiceBtn"); if(vb) vb.textContent="🔊 もう一度聞く"; };
    speechSynthesis.speak(u); });
  const vb=$("voiceBtn"); if(vb) vb.textContent="⏹ 音声をとめる";
}
function toggleGuide(){
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); $("voiceBtn").textContent="🔊 もう一度聞く"; }
  else speakGuide();
}
function stopGuide(){ try{ if(!run||!run.b||!curItem()||!curItem().say) speechSynthesis.cancel(); }catch(e){} }
function curItem(){ return run.round===1 ? run.items[run.idx] : run.queue[run.idx]; }
function nextItem(){
  try{ speechSynthesis.cancel(); }catch(e){}
  const list = run.round===1 ? run.items : run.queue;
  if(run.round===2 && run.idx < list.length && (Date.now()-run.t0)/1000 >= run.b.min*60){ run.timeUp=true; run.idx=list.length; }
  if(run.idx >= list.length){
    /* 1回目でまちがえた問題を、ブロックの残り時間のぶんだけもう一度 */
    if(run.round===1 && run.wrongNow && run.wrongNow.length && run.b.type!=="explain" && run.b.type!=="mix"){
      const left = run.b.min*60 - (Date.now()-run.t0)/1000;
      const per = Math.max(30, run.b.min*60/Math.max(1,run.items.length));
      const n = Math.min(run.wrongNow.length, Math.floor(left/per));
      const carry = run.wrongNow.length - Math.max(0,n);
      if(n>0){
        run.round=2; run.queue=run.wrongNow.slice(0,n); run.idx=0; run.carry=run.wrongNow.slice(n); run.wrongNow=[];
        $("stage").innerHTML = `<div class="card"><div class="lead"><b>のこり時間で、まちがえた ${n} 問をもう一度。</b><br>解説を思い出して書こう。${carry?`<br>のこり ${carry} 問は、水曜の弱点補強にまわします。`:""}<br>時間が来たら、とちゅうでも終わります。</div></div>
          <div class="tools"><div class="sp"></div><button class="btn primary" onclick="showItem()">2回目へ</button></div>`;
        hidePad(); return;
      }
      run.carry=run.wrongNow; run.wrongNow=[];
    }
    return finishBlock(run.n ? Math.round(run.ok/run.n*100) : null);
  }
  showItem();
}
function showItem(){
  const it=curItem(); setProg();
  run.qt0=Date.now(); run.answered=false; tick();
  if(run.b.type==="explain") return showExplain(it);
  let h = `<div class="card">`;
  if(it.ref) h += `<div class="ref">問題用紙 ${it.ref}</div>`;
  if(it.say){
    run.plays=0;
    h += `<div class="say"><button class="btn primary listenbtn" id="playBtn" onclick="playSay()">▶ 聞く</button><span id="playLeft" style="color:var(--sub)">あと2回</span></div>`;
  }
  h += `<div class="qtext" style="margin-top:6px">${it.q}</div>`;
  if(it.hint) h += `<div style="margin-top:10px"><button class="btn sm" onclick="this.outerHTML='<div class=hintbox>💡 ${esc(it.hint)}</div>'">💡 ヒント</button></div>`;
  h += `</div>`;
  $("stage").innerHTML = h;
  if(it.m==="self"){ hidePad();
    $("stage").innerHTML += `<div class="tools"><div class="sp"></div><button class="btn primary" onclick="this.parentNode.remove();showResult(curItem(),null)">問題用紙に書けた → 答えを見る</button></div>`;
    return; }
  showPad();
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/'/g,"&#39;").replace(/"/g,"&quot;"); }

/* ---------- 説明タイム ---------- */
function showExplain(it){
  hidePad();
  $("stage").innerHTML = `<div class="card">${it.ref?`<div class="ref">問題用紙 ${it.ref}</div>`:""}
    <div class="qtext">「${it.q}」を説明しよう</div>
    <div class="lead" style="color:var(--sub);margin-top:6px">聞く人：言えたポイントにチェック</div>
    <div class="pts">${it.pts.map((p,i)=>`<label><input type="checkbox" id="pt${i}" onchange="ptCheck()"> ${p}</label>`).join("")}</div></div>
    <div class="tools"><button class="btn" onclick="explainDone(false)">もう一度あとで</button><div class="sp"></div>
    <button class="btn ok" id="exOk" onclick="explainDone(true)" disabled>説明できた</button></div>`;
}
function ptCheck(){ const it=curItem(); $("exOk").disabled = !it.pts.every((_,i)=>$("pt"+i).checked); }
function explainDone(ok){
  const it=curItem(); store.explain[it.id]={ok, ts:Date.now()}; save();
  run.n++; if(ok) run.ok++; run.idx++; nextItem();
}

/* ---------- リスニング ---------- */
function playSay(){
  const it=curItem(); if(run.plays>=2) return;
  if(!("speechSynthesis" in window)){ $("playLeft").textContent="この端末は音声読み上げに対応していません"; return; }
  run.plays++; $("playLeft").textContent = run.plays>=2 ? "（もう聞けません）" : "あと1回";
  if(run.plays>=2) $("playBtn").disabled=true;
  speechSynthesis.cancel();
  const voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const vA=voices.find(v=>/US/i.test(v.lang))||voices[0], vB=voices.find(v=>v!==vA)||vA;
  it.say.forEach(([who,txt],i)=>{
    const u=new SpeechSynthesisUtterance(txt); u.lang="en-US"; u.rate=0.88;
    if(who==="B"){ u.voice=vB; u.pitch=1.25; } else { u.voice=vA; u.pitch=who==="N"?1:0.9; }
    speechSynthesis.speak(u);
    if(i<it.say.length-1){ const g=new SpeechSynthesisUtterance(" "); g.rate=0.5; speechSynthesis.speak(g); }
  });
}
if("speechSynthesis" in window) speechSynthesis.getVoices();

/* ---------- 総復習：まちがえた問題を集める ---------- */
function allItems(){
  const seen={}; const out=[];
  BLOCKS.filter(x=>x.items && x.type!=="explain" && x.type!=="mix" && x.type!=="weak")
    .forEach(x=>x.items.forEach(it=>{ if(!seen[it.id]){ seen[it.id]=1; out.push(Object.assign({},it,{_subj:x.subj,_day:x.day})); } }));
  return out;
}
function remaining(filter){ return allItems().filter(it=>store.res[it.id] && !store.res[it.id].ok && (!filter||filter(it))); }
function mixItems(b){
  /* その日にまちがえて、まだ直っていない問題だけ（月曜は月曜分、火曜は火曜分） */
  if(b.type==="weak") return remaining(it=>it._subj===b.subj);
  return remaining(it=>(store.res[it.id].day||it._day)===b.day);
}

/* ---------- 終了 ---------- */
function finishBlock(score){
  const b=run.b, sec=Math.floor((Date.now()-run.t0)/1000);
  const sch=BLOCKS.filter(x=>x.day===b.day&&x.slot!=null), nb=sch[sch.findIndex(x=>x.id===b.id)+1];
  if(nb&&nb.type==="explain") setTimeout(()=>{try{const u=new SpeechSynthesisUtterance("つぎは説明タイム。おうちの人を呼ぼう。");u.lang="ja-JP";const v=jaVoice();if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}},400);
  store.blocks[b.id] = { done:true, score: score!=null ? score+"%" : null, sec, ts:Date.now() }; save();
  clearInterval(clockTimer); hidePad(); speechSynthesis?.cancel?.(); run.qt0=null; $("qPaceBar").style.width="0%"; $("rPace").textContent="";
  const left = (b.type==="mix"||b.type==="weak") ? remaining(it=>run.items.some(x=>x.id===it.id)).length
             : (b.items||[]).filter(it=>store.res[it.id]&&!store.res[it.id].ok).length;
  let msg = score==null ? "おつかれさま！" : (score>=80 ? "よくできました！" : score>=50 ? "もう少し！" : "ここからが本番。");
  if(run.timeUp) msg += "<br>時間になったので、ここで終わりにしました。";
  if(run.times && run.times.length){
    const avg=Math.round(run.times.reduce((a,x)=>a+x.sec,0)/run.times.length);
    const slow=run.times.filter(x=>x.sec>run.per*1.5).length;
    const prevBest=store.best?.[b.id];
    msg += `<br>1問の平均 <b>${avg}秒</b>（目安 ${run.per}秒）${avg<=run.per?" ✔ 目安クリア":""}`;
    if(slow) msg += `<br>目安の1.5倍以上かかった問題 ${slow}問 → 水曜にスピード練習`;
    if(prevBest) msg += `<br>前回の平均 ${prevBest}秒 → 今回 ${avg}秒 ${avg<prevBest?"（速くなった！）":""}`;
    store.best=store.best||{}; store.best[b.id]=prevBest?Math.min(prevBest,avg):avg; save();
  }
  if(left) msg += `<br>まだ✕の問題 <b>${left}問</b> は、${b.day==="wed"?"もう一度ここで":"水曜の弱点補強"}にまわします。`;
  $("stage").innerHTML = `<div class="card" style="text-align:center">
    <div class="lead">${b.title}</div>${score!=null?`<div class="big">${score}%</div>`:""}
    <div class="lead">${msg}<br>かかった時間：${Math.round(sec/60)}分（目安 ${b.min}分）</div>
    ${nb&&nb.type==="explain"?`<div class="hintbox" style="margin-top:10px">👪 つぎは説明タイム。おうちの人を呼ぼう。</div>`:""}</div>
    <div class="tools"><div class="sp"></div><button class="btn primary" onclick="goHome()">つぎへ（ホーム）</button></div>`;
  $("rProg").style.width="100%";
}
function quitBlock(){ modal(`<div style="font-size:18px;font-weight:800;margin-bottom:8px">ホームにもどる？</div><div class="lead">ここまでの〇×は記録されます。</div>
  <div class="tools"><div class="sp"></div><button class="btn" onclick="closeModal()">つづける</button><button class="btn primary" onclick="closeModal();goHome()">ホームにもどる</button></div>`); }
function goHome(){ clearInterval(clockTimer); run=null; hidePad(); try{speechSynthesis.cancel();}catch(e){}
  $("run").classList.add("hidden"); $("home").classList.remove("hidden"); renderHome(); window.scrollTo(0,0); }

/* ============================================================
   手書きパッド（kijutsu250 と同じしくみ）
   ============================================================ */
const pad=$("pad"), ctx=pad.getContext("2d");
let strokes=[], curStroke=null, activePointer=null, locked=false;
function showPad(){
  $("padArea").classList.remove("hidden"); $("resBox").innerHTML="";
  pad.classList.toggle("big", !!(curItem()&&curItem().big));
  strokes=[]; locked=false; $("gradeBtn").disabled=false; $("gradeBtn").innerHTML="答え合わせ";
  resizePad();
}
function hidePad(){ $("padArea").classList.add("hidden"); $("resBox").innerHTML=""; }
function resizePad(){ const r=pad.getBoundingClientRect(), d=window.devicePixelRatio||1;
  pad.width=Math.round(r.width*d); pad.height=Math.round(r.height*d); ctx.setTransform(d,0,0,d,0,0); redraw(); }
window.addEventListener("resize",()=>{ if(!$("padArea").classList.contains("hidden")) resizePad(); });
function pt(e){ const r=pad.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,p:(e.pointerType==="pen"&&e.pressure>0)?e.pressure:0.5}; }
function drawSeg(a,b){ ctx.strokeStyle="#111"; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=2+b.p*3.2; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
function drawStroke(s){ if(s.length===1){ ctx.fillStyle="#111"; ctx.beginPath(); ctx.arc(s[0].x,s[0].y,2.5,0,7); ctx.fill(); return; } for(let i=1;i<s.length;i++) drawSeg(s[i-1],s[i]); }
function redraw(){ const r=pad.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); strokes.forEach(drawStroke); $("padHint").style.display=strokes.length?"none":"block"; }
pad.addEventListener("pointerdown",e=>{ if(locked||activePointer!==null) return; activePointer=e.pointerId; pad.setPointerCapture(e.pointerId);
  curStroke=[pt(e)]; strokes.push(curStroke); drawStroke(curStroke); $("padHint").style.display="none"; e.preventDefault(); });
pad.addEventListener("pointermove",e=>{ if(e.pointerId!==activePointer||!curStroke) return;
  (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{ const p=pt(ev), last=curStroke[curStroke.length-1]; curStroke.push(p); drawSeg(last,p); }); e.preventDefault(); });
function endStroke(e){ if(e.pointerId!==activePointer) return; activePointer=null; curStroke=null; }
pad.addEventListener("pointerup",endStroke); pad.addEventListener("pointercancel",endStroke);
function undo(){ if(locked) return; strokes.pop(); redraw(); }
function clearPad(){ if(locked) return; strokes=[]; redraw(); }
function exportImage(){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  strokes.forEach(s=>s.forEach(p=>{minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);}));
  const m=20; minX-=m;minY-=m;maxX+=m;maxY+=m; const w=maxX-minX,h=maxY-minY, sc=Math.min(1.5,768/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*sc); c.height=Math.round(h*sc);
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.setTransform(sc,0,0,sc,-minX*sc,-minY*sc);
  x.strokeStyle="#000"; x.fillStyle="#000"; x.lineCap="round"; x.lineJoin="round";
  strokes.forEach(s=>{ if(s.length===1){ x.beginPath(); x.arc(s[0].x,s[0].y,2.5,0,7); x.fill(); return; }
    for(let i=1;i<s.length;i++){ x.lineWidth=2+s[i].p*3.2; x.beginPath(); x.moveTo(s[i-1].x,s[i-1].y); x.lineTo(s[i].x,s[i].y); x.stroke(); } });
  return c.toDataURL("image/jpeg",0.85);
}

/* ============================================================
   採点（Gemini）
   ============================================================ */
function stripTags(h){ const d=document.createElement("div"); d.innerHTML=String(h).replace(/<br>/g," / "); return d.textContent; }
async function callGemini(prompt, img, maxTok){
  const parts=[{text:prompt}]; if(img) parts.push({inline_data:{mime_type:"image/jpeg",data:img.split(",")[1]}});
  const body={contents:[{parts}],generationConfig:{temperature:0,responseMimeType:"application/json",maxOutputTokens:maxTok,thinkingConfig:{thinkingLevel:"minimal"}}};
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName())}:generateContent`;
  const call=b=>fetch(url,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":apiKey()},body:JSON.stringify(b)});
  let res=await call(body);
  if(res.status===400){ delete body.generationConfig.thinkingConfig; body.generationConfig.maxOutputTokens=Math.max(1024,maxTok); res=await call(body); }
  if(!res.ok){ let m="HTTP "+res.status; try{ const j=await res.json(); m=j.error?.message?.slice(0,80)||m; }catch(e){} throw new Error(m); }
  const j=await res.json(); const t=j.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
  const mm=t.match(/\{[\s\S]*\}/); if(!mm) throw new Error("応答を読み取れません"); return JSON.parse(mm[0]);
}
function norm(x){ return String(x||"").normalize("NFKC").replace(/[\s　.,。、・「」『』"'’()（）]/g,"").replace(/[−–ー―]/g,"-").toLowerCase(); }
function exactMatch(read, it){
  const r=norm(read); if(!r||r.includes("?")) return false;
  if(it.sort){ const k=x=>[...String(x).normalize("NFKC")].filter(c=>/[ァ-ヶa-zA-Z]/.test(c)).sort().join("");
    return it.a.some(a=>k(a)===k(read)); }
  return it.a.some(a=>{ const n=norm(a); return r===n || (r.startsWith(n) && /^[ぁ-ゟ]+$/.test(r.slice(n.length))); });
}
async function aiGrade(it, img){
  if(it.m==="exact"){
    const r=await callGemini(`手書き文字を一字一句そのまま書き起こす。誤字・脱字・つづり誤りも直さず、推測で補わない。読めない字は?。\n文字種:${it.hint||"指定なし"}\nJSONのみ:{"read":"書き起こし","unclear":true/false}`, img, 120);
    const ok=exactMatch(r.read,it);
    return {read:r.read, correct:ok, comment:r.unclear?"読み取りに自信がありません。判定を確認してください。":""};
  }
  return await callGemini(`中3の手書き解答を採点。画像の文字を推測せず読み取り、基準に従い判定。\n問題:${stripTags(it.q)}\n正解:${it.a.join("／")}\n基準:${it.rule||"正解と同じ内容なら正解"}\nJSONのみ:{"read":"読取","correct":true/false,"comment":"20字以内"}`, img, 220);
}
async function onGrade(){
  if(!strokes.length){ $("resBox").innerHTML=`<div class="res"><div class="row">答えを書いてから「答え合わせ」を押そう。</div></div>`; return; }
  const it=curItem(); locked=true; $("gradeBtn").disabled=true;
  run.ansSec = Math.round((Date.now()-run.qt0)/1000); run.answered=true;
  if(!apiKey()){ return showResult(it, null); }
  $("gradeBtn").innerHTML=`<span class="spinner"></span>採点中…`;
  try{ const r=await aiGrade(it, exportImage()); showResult(it, r); }
  catch(e){ $("resBox").innerHTML=`<div class="res"><div class="row">AI採点ができませんでした（${esc(e.message)}）。自己採点にします。</div></div>`; showResult(it,null,true); }
}
function showResult(it, r, keep){
  $("gradeBtn").innerHTML="答え合わせ";
  const box=$("resBox");
  if(!r){ /* 自己採点 */
    box.innerHTML = (keep?box.innerHTML:"") + `<div class="res"><div class="row"><b>正解</b>${esc(it.a[0])}</div><div class="row">${it.exp||""}</div>
      <div class="fix"><span style="align-self:center">自分の答えは…</span><button class="btn ok" onclick="record(true)">〇 合っていた</button><button class="btn ng" onclick="record(false)">✕ ちがった</button></div></div>`;
    return;
  }
  const ok=!!r.correct; run.last={ok, read:r.read};
  box.innerHTML = `<div class="res ${ok?"ok":"ng"}"><span class="mark">${ok?"〇":"✕"}</span>
    <div class="row"><b>読み取り</b>${esc(r.read||"")}</div>
    <div class="row"><b>正解</b>${esc(it.a[0])}</div>
    ${r.comment?`<div class="row" style="color:var(--sub)">${esc(r.comment)}</div>`:""}
    <div class="row">${it.exp||""}</div>
    <div class="fix"><button class="btn sm" onclick="flip()">判定がおかしい → ${ok?"✕":"〇"}にする</button><div style="flex:1"></div>
    <button class="btn primary" onclick="record(${ok})">つぎへ</button></div></div>`;
  clearTimeout(run.autoT);
  if(ok && !r.comment?.includes("手で直し")) run.autoT=setTimeout(()=>{ if(run && curItem()===it) record(true); }, 1200);
}
function flip(){ clearTimeout(run.autoT); const it=curItem(); const ok=!run.last.ok; showResult(it,{correct:ok,read:run.last.read,comment:"（判定を手で直しました）"}); }
function record(ok){
  clearTimeout(run.autoT);
  const it=curItem();
  const qs = run.ansSec!=null ? run.ansSec : Math.round((Date.now()-(run.qt0||Date.now()))/1000); run.ansSec=null;
  if(run.round===1) run.times.push({id:it.id, ref:it.ref, sec:qs, ok, subj:it._subj||run.b.subj});
  if(run.round===1){ run.n++; if(ok) run.ok++; if(!ok){ (run.wrongNow=run.wrongNow||[]).push(it); } }
  /* 2回目で〇でも、1回目の✕は総復習に残す（同じ日に3回目を出すため）。総復習で〇になったら消える */
  const prev=store.res[it.id];
  /* 1回目✕ → ok:false。2回目・まとめ・水曜で〇 → ok:true（fixed） */
  const day = run.b.type==="weak" ? (prev?.day||"wed") : run.b.day;
  if(run.round===1 && run.b.type!=="mix" && run.b.type!=="weak")
    store.res[it.id]={ ok, ts:Date.now(), tries:(prev?.tries||0)+1, day, subj:run.b.subj, wrong1: !ok, sec:qs, per:run.per };
  else
    store.res[it.id]=Object.assign({}, prev||{day,subj:run.b.subj}, { ok: ok || false, fixed: ok, ts:Date.now(), tries:(prev?.tries||0)+1 });
  save(); run.idx++; nextItem();
}

/* ============================================================
   記録・保存・設定
   ============================================================ */
function summaryText(){
  let t="【診断④やり直し】\n";
  Object.keys(DAYS).filter(d=>d!=="wed").forEach(d=>{
    t+=`■${DAYS[d].label}\n`;
    blocksOf(d).filter(b=>b.type!=="break").forEach(b=>{ const s=store.blocks[b.id];
      const best=store.best?.[b.id];
      t+=`・${b.title}：${s?.done?(s.score||"済")+`（${Math.round((s.sec||0)/60)}分${best?`・1問平均${best}秒`:""}）`:"未"}\n`; });
  });
  const rem=remaining();
  t+=`■水曜の弱点補強用：まだ✕ ${rem.length}問\n`;
  ["sugaku","rika","eigo","shakai","kokugo"].forEach(sj=>{ const r=rem.filter(it=>it._subj===sj); if(r.length)
    t+=`${SUBJ[sj]}${r.length}問：${r.map(it=>it.ref?it.ref.replace(/^\S+ /,""):it.id).join("、")}\n`; });
  const slow=allItems().filter(it=>{const r=store.res[it.id]; return r && r.ok && r.sec && r.per && r.sec>r.per*1.5;});
  if(slow.length){ t+=`■時間がかかった問題（正解だが目安の1.5倍以上）${slow.length}問\n`;
    ["sugaku","rika","eigo","shakai","kokugo"].forEach(sj=>{ const r=slow.filter(it=>it._subj===sj); if(r.length)
      t+=`${SUBJ[sj]}：${r.map(it=>(it.ref?it.ref.replace(/^\S+ /,""):it.id)+`(${store.res[it.id].sec}秒)`).join("、")}\n`; }); }
  const wrong=[];
  const ex=BLOCKS.flatMap(b=>b.type==="explain"?b.items.filter(it=>store.explain[it.id]&&!store.explain[it.id].ok).map(it=>it.q):[]);
  if(ex.length) t+=`説明やり直し：${ex.join("、")}\n`;
  return t;
}
/* ---------- 分析ファイル（この端末＋Googleドライブに保存） ---------- */
function analysisText(){
  const SJ=["sugaku","rika","eigo","shakai","kokugo"], now=new Date();
  const items=allItems(), done=items.filter(it=>store.res[it.id]);
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
  let t=`学習の診断④ やり直し 分析レポート\n作成：${now.toLocaleString("ja-JP")}\n\n`;
  t+=`■ブロックの結果\n`;
  ["mon","tue"].forEach(d=>{ t+=`[${DAYS[d].label}]\n`;
    blocksOf(d).forEach(b=>{ const s=store.blocks[b.id];
      t+=`・${b.title}：${s?.done?`${s.score||"済"}／${Math.round((s.sec||0)/60)}分（目安${b.min}分）`:"未実施"}\n`; }); });
  t+=`\n■教科別（1回目の正答率・1問の平均時間）\n`;
  const plan=[];
  SJ.forEach(sj=>{
    const d=done.filter(it=>it._subj===sj); if(!d.length) return;
    const r=d.map(it=>store.res[it.id]);
    const first=r.filter(x=>x.wrong1===false).length, firstN=r.filter(x=>x.wrong1!==undefined).length;
    const ts=r.filter(x=>x.sec), avg=ts.length?Math.round(ts.reduce((a,x)=>a+x.sec,0)/ts.length):0;
    const per=ts.length?Math.round(ts.reduce((a,x)=>a+(x.per||0),0)/ts.length):0;
    const wrong=d.filter(it=>!store.res[it.id].ok), fixed=d.filter(it=>store.res[it.id].fixed);
    const slow=d.filter(it=>{const x=store.res[it.id]; return x.ok && x.sec && x.per && x.sec>x.per*1.5;});
    t+=`${SUBJ[sj]}：解いた${d.length}問／1回目正答率 ${pct(first,firstN)}／平均 ${avg}秒（目安${per}秒）／2回目以降で直した ${fixed.length}問／まだ✕ ${wrong.length}問／時間がかかった ${slow.length}問\n`;
    if(wrong.length) t+=`  まだ✕：${wrong.map(it=>(it.ref||it.id).replace(/^\S+ /,"")).join("、")}\n`;
    if(slow.length) t+=`  時間がかかった：${slow.map(it=>(it.ref||it.id).replace(/^\S+ /,"")+`(${store.res[it.id].sec}秒)`).join("、")}\n`;
    const m=Math.ceil(wrong.length*2 + slow.length*1);
    if(m) plan.push([SUBJ[sj],m,wrong.length,slow.length]);
  });
  const ex=BLOCKS.flatMap(b=>b.type==="explain"?b.items.filter(it=>store.explain[it.id]&&!store.explain[it.id].ok).map(it=>it.q):[]);
  if(ex.length) t+=`\n■説明できなかった：${ex.join("、")}\n`;
  t+=`\n■水曜の弱点補強 目安時間（✕1問=2分〔やり直し＋類似問題〕、時間がかかった1問=1分）\n`;
  plan.sort((a,b)=>b[1]-a[1]).forEach(p=>t+=`${p[0]}：${p[1]}分（✕${p[2]}問・スピード${p[3]}問）\n`);
  t+=`合計：${plan.reduce((a,p)=>a+p[1],0)}分\n`;
  const raw={ created:now.toISOString(), blocks:store.blocks, explain:store.explain,
    items:done.map(it=>Object.assign({id:it.id, ref:it.ref||"", subj:it._subj, q:stripTags(it.q||"").slice(0,80)}, store.res[it.id])) };
  t+=`\n----- データ（Claude読み取り用） -----\n`+JSON.stringify(raw);
  return t;
}
function analysisName(){ const n=new Date(), z=x=>String(x).padStart(2,"0");
  return `診断4やり直し_分析_${n.getFullYear()}${z(n.getMonth()+1)}${z(n.getDate())}_${z(n.getHours())}${z(n.getMinutes())}.txt`; }
function saveLocal(){
  const blob=new Blob([analysisText()],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=analysisName(); document.body.appendChild(a); a.click(); a.remove();
  $("saveMsg").innerHTML="✔ この端末の「ダウンロード」に保存しました。";
}
async function saveDrive(){
  const text=analysisText();
  if(window.showSaveFilePicker){
    try{
      const h=await showSaveFilePicker({ suggestedName:analysisName(), types:[{description:"テキスト",accept:{"text/plain":[".txt"]}}] });
      const w=await h.createWritable(); await w.write(text); await w.close();
      $("saveMsg").innerHTML="✔ 保存しました。Googleドライブの「診断4やり直し記録」フォルダを選んでいれば、ドライブに入っています。"; return;
    }catch(e){ if(e.name==="AbortError") return; }
  }
  saveLocal(); $("saveMsg").innerHTML+="<br>この端末では保存先を選べないので、ダウンロードしたファイルをGoogleドライブの「診断4やり直し記録」フォルダに入れてください。";
}
function openSummary(){
  const rows=Object.keys(DAYS).filter(d=>d!=="wed").map(d=>`<tr><th colspan="3">${DAYS[d].label}</th></tr>`+blocksOf(d).filter(b=>b.type!=="break").map(b=>{const s=store.blocks[b.id];
    return `<tr><td>${b.title}</td><td>${s?.done?(s.score||"済"):"—"}</td><td>${s?.done?Math.round((s.sec||0)/60)+"分":""}</td></tr>`;}).join("")).join("");
  modal(`<div style="font-size:18px;font-weight:800;margin-bottom:8px">記録</div><div style="max-height:45vh;overflow:auto"><table class="sum">${rows}</table></div>
    <div class="lead" style="margin-top:10px">毎日の最後に、分析ファイルを保存してください。Googleドライブに保存すると、おうちの人のスマホからも見られます（水曜の時間割はこれを見て組みます）。</div>
    <div class="tools"><button class="btn" onclick="saveLocal()">💾 この端末に保存</button><button class="btn" onclick="saveDrive()">☁ Googleドライブに保存</button></div>
    <div class="lead" id="saveMsg" style="margin-top:6px;color:var(--sub)"></div>
    <div class="tools"><button class="btn sm" onclick="resetAll()">記録を消す</button><div class="sp"></div><button class="btn primary" onclick="closeModal()">閉じる</button></div>`);
}
function sendLine(){ location.href="https://line.me/R/msg/text/?"+encodeURIComponent(summaryText()); }
function resetAll(){ modal(`<div style="font-size:18px;font-weight:800;margin-bottom:8px">2日間の記録をすべて消しますか？</div>
  <div class="tools"><div class="sp"></div><button class="btn" onclick="closeModal()">やめる</button><button class="btn ng" onclick="doReset()">消す</button></div>`); }
function doReset(){ store.res={}; store.blocks={}; store.explain={}; save(); closeModal(); renderHome(); }
function openSettings(){
  modal(`<div style="font-size:18px;font-weight:800">設定</div>
    <label>Gemini APIキー（空欄なら手書き一問一答のキーを使う／なければ自己採点）<input type="text" id="sKey" value="${esc(store.key||"")}" placeholder="${apiKey()?"手書き一問一答のキーを使用中":"未設定"}"></label>
    <label>モデル<input type="text" id="sModel" value="${esc(store.model||"")}" placeholder="gemini-flash-latest"></label>
    <div class="tools"><div class="sp"></div><button class="btn" onclick="closeModal()">やめる</button><button class="btn primary" onclick="saveSettings()">保存</button></div>`);
}
function saveSettings(){ store.key=$("sKey").value.trim(); store.model=$("sModel").value.trim()||"gemini-flash-latest"; save(); closeModal(); renderHome(); }
function modal(h){ $("modalBody").innerHTML=h; $("modal").classList.remove("hidden"); }
function closeModal(){ $("modal").classList.add("hidden"); }

renderHome();
</script>
